services:
  postgres:
    container_name: databasus-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: databasus
      POSTGRES_USER: databasus
      POSTGRES_PASSWORD: databasus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databasus -d databasus"]
      interval: 10s
      timeout: 5s
      retries: 10

  databasus:
    container_name: databasus
    image: databasus/databasus:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4005:4005"
    volumes:
      - ./databasus-data:/databasus-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
